<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Estadísticas - ISSSTE</title>

  <!-- Estilos generales -->
  <link rel="stylesheet" href="/static/css/style.css"/>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="stats-page">

  <header class="page-header">
    <h1>Estadísticas ISSSTE</h1>
    <a class="btn-back" href="/dashboard">Regresar al Dashboard</a>
  </header>

  <main class="stats-container">
    <!-- Filtros -->
    <section class="filters">
      <div class="filter">
        <label for="estadoFiltro">Estado</label>
        <select id="estadoFiltro">
          <option value="">Todos</option>
          <option value="Solucionado">Solucionado</option>
          <option value="No Solucionado">No Solucionado</option>
          <option value="En Proceso">En Proceso</option>
          <option value="Sin Categorizar">Sin Categorizar</option>
        </select>
      </div>
      <div class="filter">
        <label for="categoriaFiltro">Categoría</label>
        <select id="categoriaFiltro">
          <option value="">Todas</option>
          <option>Infraestructura</option>
          <option>Personal</option>
          <!-- etc. -->
        </select>
      </div>
      <div class="filter">
        <label for="fechaInicio">Desde</label>
        <input type="date" id="fechaInicio"/>
      </div>
      <div class="filter">
        <label for="fechaFin">Hasta</label>
        <input type="date" id="fechaFin"/>
      </div>
      <div class="filter filter-action">
        <button id="applyBtn">Aplicar Filtros</button>
      </div>
    </section>

    <!-- Gráficos -->
    <section class="charts">
      <article class="chart-card">
        <h2>Vista General</h2>
        <canvas id="overviewChart"></canvas>
      </article>
      <article class="chart-card">
        <h2>Problemas por Categoría</h2>
        <canvas id="categoryChart"></canvas>
      </article>
      <article class="chart-card scatter-full">
        <h2>Dispersión de Problemas</h2>
        <canvas id="scatterChart"></canvas>
      </article>
    </section>
  </main>

  <footer class="page-footer">
    <p>© Todos los derechos reservados – ISSSTE</p>
  </footer>

  <!-- Lógica de carga y actualización de gráficos -->
  <script>
    let overviewChart, categoryChart, scatterChart;

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('applyBtn').addEventListener('click', aplicarFiltros);
      cargarDatosEstadisticas();
    });

    function cargarDatosEstadisticas(filtros = null) {
      const opts = filtros
        ? { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(filtros) }
        : {};
      fetch('/api/estadisticas', opts)
        .then(r => r.json())
        .then(data => data && data.problemas_por_estado
          ? actualizarGraficos(data)
          : console.error('Formato de datos incorrecto'))
        .catch(err => console.error('Error al obtener estadísticas:', err));
    }

    function aplicarFiltros() {
      const filtros = {
        estado: document.getElementById('estadoFiltro').value,
        categoria: document.getElementById('categoriaFiltro').value,
        fecha_inicio: document.getElementById('fechaInicio').value,
        fecha_fin: document.getElementById('fechaFin').value
      };
      cargarDatosEstadisticas(filtros);
    }

    function actualizarGraficos(data) {
      // Destruir instancias previas
      if (overviewChart) overviewChart.destroy();
      if (categoryChart) categoryChart.destroy();
      if (scatterChart) scatterChart.destroy();

      // Vista General (barras)
      overviewChart = new Chart(
        document.getElementById('overviewChart').getContext('2d'),
        {
          type: 'bar',
          data: {
            labels: data.problemas_por_estado_labels,
            datasets: [{
              label: 'Cantidad',
              data: data.problemas_por_estado,
              backgroundColor: ['#BC955C','#691C32','#6F7271','#D3D3D3'],
              borderWidth: 1
            }]
          },
          options: {
            scales: { y: { beginAtZero: true } },
            plugins: {
              tooltip: {
                callbacks: { label: ctx => `${ctx.label}: ${ctx.raw}` }
              }
            }
          }
        }
      );

      // Problemas por Categoría (pie)
      categoryChart = new Chart(
        document.getElementById('categoryChart').getContext('2d'),
        {
          type: 'pie',
          data: {
            labels: data.problemas_por_categoria.labels,
            datasets: [{
              data: data.problemas_por_categoria.data,
              backgroundColor: ['#BC955C','#691C32','#6F7271','#D3D3D3','#FFCE56','#FF6384']
            }]
          },
          options: {
            plugins: { legend: { position: 'top' } }
          }
        }
      );

      // Dispersión (scatter)
      scatterChart = new Chart(
        document.getElementById('scatterChart').getContext('2d'),
        {
          type: 'scatter',
          data: {
            datasets: [{
              label: 'Nivel vs Estado',
              data: data.problemas_scatter,
              backgroundColor: '#691C32'
            }]
          },
          options: {
            scales: {
              x: {
                type: 'category',
                labels: data.problemas_scatter.map(d => d.x),
                title: { display: true, text: 'Estado' }
              },
              y: {
                beginAtZero: true,
                title: { display: true, text: 'Nivel de Riesgo' }
              }
            },
            plugins: {
              tooltip: { callbacks: { label: t => `Riesgo: ${t.raw.y}` } }
            }
          }
        }
      );
    }
  </script>
</body>
</html>
