<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mapa Unidades ISSSTE</title>

  <!-- Tu CSS principal -->
  <link rel="stylesheet" href="/static/css/style.css"/>

  <!-- Leaflet y MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"/>
</head>

<body class="map-page">
  <header>
    <h1>Mapa Unidades ISSSTE</h1>
    <a class="btn-back" href="/dashboard">Regresar al Dashboard</a>
  </header>

  <div class="container">
    <h2 class="text-center">Mapa ISSSTE</h2>
    <div id="mapid"></div>
    <button id="btnZoomOut" class="btn-zoom-out" onclick="zoomOut()">Alejar Mapa</button>

    <h2 class="text-center">Listado de Marcadores</h2>
    <div class="search-container">
      <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Buscar por unidad médica…"/>
    </div>
    <table>
      <thead>
        <tr><th>ID</th><th>Nombre</th></tr>
      </thead>
      <tbody id="markers-list"></tbody>
    </table>
  </div>

  <footer>Todos los derechos reservados – ISSSTE</footer>

  <!-- Scripts de Leaflet + clusters + KML -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
  <script src="/static/js/leaflet-kml.js"></script>

  <script>
    // 1. Inicializar mapa
    var map = L.map('mapid').setView([23.634501, -102.552784], 5),
        initialZoom = map.getZoom();

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    // 2. Grupo de clusters
    var markersCluster = L.markerClusterGroup().addTo(map);

    // 3. Icono personalizado
    var customIcon = L.icon({
      iconUrl: 'https://unpkg.com/leaflet@1.7.1/dist/images/marker-icon.png',
      iconSize: [15,25], iconAnchor: [7.5,25]
    });

    // 4. Cargar KML y añadir a los clusters
    fetch('/static/kml/sitios_issste.kml')
      .then(r => r.text())
      .then(kmlText => {
        var parser = new DOMParser(),
            kml    = parser.parseFromString(kmlText,'text/xml'),
            track  = new L.KML(kml);

        track.eachLayer(function(layer){
          if (layer instanceof L.Marker) {
            layer.setIcon(customIcon);
            markersCluster.addLayer(layer);

            // Poblar tabla
            var latlng = layer.getLatLng(),
                popup   = layer.getPopup().getContent(),
                id      = document.querySelectorAll('#markers-list tr').length + 1,
                row     = document.createElement('tr');

            row.innerHTML = `
              <td>${id}</td>
              <td><a href="#" onclick="zoomToMarker(${latlng.lat},${latlng.lng})">${popup}</a></td>
            `;
            document.getElementById('markers-list').appendChild(row);
          }
        });
      })
      .catch(console.error);

    // 5. Leyenda
    var legend = L.control({position:'bottomright'});
    legend.onAdd = function(){
      var div = L.DomUtil.create('div','legend');
      div.innerHTML = `
        <h4>Leyenda</h4>
        <i style="background:green"></i> Bajo riesgo<br>
        <i style="background:orange"></i> Medio riesgo<br>
        <i style="background:red"></i> Alto riesgo
      `;
      return div;
    };
    legend.addTo(map);

    // 6. Zoom a marcador / reset
    function zoomToMarker(lat,lng){
      map.setView([lat,lng],15);
      document.getElementById('btnZoomOut').style.display='block';
    }
    function zoomOut(){
      map.setView([23.634501,-102.552784], initialZoom);
      document.getElementById('btnZoomOut').style.display='none';
    }

    // 7. Filtrar tabla
    function filterTable(){
      var filter = document.getElementById('searchInput').value.toUpperCase(),
          trs    = document.querySelectorAll('#markers-list tr');
      trs.forEach(tr => {
        var txt = tr.cells[1].innerText.toUpperCase();
        tr.style.display = txt.includes(filter) ? '' : 'none';
      });
    }
  </script>
</body>
</html>
